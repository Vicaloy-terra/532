<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>今夜别开灯</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#000;color:#c9c9c9;
    font-family:"SimSun","Songti SC","STSong",serif;
    user-select:none;-webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none;
    position:fixed;inset:0;
  }
  #game{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform;}

  /* 第一人称呼吸/走路晃动层 */
  #view{position:absolute;inset:0;}

  /* 手电筒光圈（视角跟随） */
  #dark{
    position:absolute;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(circle 120px at 50% 50%,
      rgba(0,0,0,0) 0%,rgba(0,0,0,.5) 40%,
      rgba(0,0,0,.95) 72%,#000 100%);
    transition:opacity .3s;
  }
  #dark.off{
    background:radial-gradient(circle 45px at 50% 50%,
      rgba(0,0,0,.55) 0%,rgba(0,0,0,.97) 55%,#000 100%);
  }
  /* 手电筒暖色光晕 */
  #glow{
    position:absolute;inset:0;pointer-events:none;z-index:4;
    background:radial-gradient(circle 200px at 50% 50%,
      rgba(255,230,170,.14) 0%,rgba(255,200,120,.05) 45%,transparent 70%);
    opacity:0;transition:opacity .3s;
  }
  #glow.on{opacity:1;}

  /* 手持抖动噪点 */
  #grain{
    position:absolute;inset:0;z-index:6;pointer-events:none;
    opacity:.06;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation:grain .18s steps(2) infinite;
  }
  @keyframes grain{
    0%{transform:translate(0,0)}25%{transform:translate(-3%,2%)}
    50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-2%)}
    100%{transform:translate(3%,1%)}
  }

  /* 文字 */
  #text{
    position:absolute;left:0;right:0;bottom:14%;
    padding:0 8%;text-align:center;
    font-size:19px;line-height:1.9;
    text-shadow:0 0 14px #000,0 0 5px #000;
    z-index:10;pointer-events:none;min-height:110px;
    transition:font-size .2s;
  }
  #text .sys{color:#5a6b5a;font-size:15px;letter-spacing:2px;}
  #text .warn{color:#d03030;text-shadow:0 0 14px #500,0 0 6px #000;}
  #text .msg{
    color:#8fb08f;font-size:16px;border:1px solid #2a3a2a;
    display:inline-block;padding:6px 14px;margin-top:8px;
    background:rgba(0,12,0,.7);
  }

  #hint{
    position:absolute;left:0;right:0;bottom:3%;
    text-align:center;font-size:13px;color:#555;
    letter-spacing:4px;z-index:10;animation:blink 2.2s infinite;
  }
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:.85}}

  /* 电量 */
  #battery{
    position:absolute;top:calc(14px + env(safe-area-inset-top));
    right:calc(16px + env(safe-area-inset-right));
    width:96px;height:16px;border:1px solid #444;
    z-index:10;padding:2px;background:rgba(0,0,0,.4);
  }
  #battery i{display:block;height:100%;background:#6a8f6a;
    transition:width .4s,background .4s;width:100%;}

  /* 突脸 */
  #face{
    position:absolute;inset:0;z-index:8;
    display:none;align-items:center;justify-content:center;
    background:#000;
  }
  #face.show{display:flex;animation:shake .05s infinite;}
  @keyframes shake{
    0%{transform:translate(0,0)}20%{transform:translate(-8px,5px)}
    40%{transform:translate(7px,-6px)}60%{transform:translate(-6px,-4px)}
    80%{transform:translate(5px,6px)}100%{transform:translate(0,0)}
  }
  #face img{
    width:100%;height:100%;object-fit:cover;
    filter:contrast(1.4) brightness(.82) grayscale(.25);
    animation:facezoom .45s cubic-bezier(.2,.9,.3,1.4);
  }
  @keyframes facezoom{
    0%{transform:scale(1.8);opacity:0;filter:contrast(2) brightness(.3)}
    60%{opacity:1}
    100%{transform:scale(1);opacity:1}
  }
  #face.blank img{filter:contrast(1.5) brightness(1.15) grayscale(1);}

  /* 红闪 */
  #flash{position:absolute;inset:0;background:#7a0000;opacity:0;
    z-index:9;pointer-events:none;}
  #flash.on{animation:redflash .35s;}
  @keyframes redflash{0%{opacity:.85}100%{opacity:0}}

  /* 场景物体 */
  .obj{position:absolute;z-index:3;opacity:.9;
    transition:transform .4s,opacity .4s;pointer-events:none;}
  #ball{left:50%;top:70%;transform:translate(-50%,0);font-size:60px;}
  #ball.roll{animation:roll 2.2s ease-in forwards;}
  @keyframes roll{
    0%{top:8%;transform:translate(-50%,0) rotate(0deg)}
    100%{top:66%;transform:translate(-50%,0) rotate(720deg)}
  }
  #girl{
    left:50%;top:-40%;transform:translate(-50%,0) rotate(180deg);
    font-size:110px;opacity:0;transition:top 1.1s,opacity 1.1s;
  }
  #girl.show{top:10%;opacity:1;}
  #girl.behind{top:72%;opacity:1;transition:top .08s;}

  /* 血迹 vignette（恐怖升温） */
  #vignette{
    position:absolute;inset:0;z-index:7;pointer-events:none;
    box-shadow:inset 0 0 180px 40px rgba(80,0,0,0);
    transition:box-shadow 1.2s;
  }
  #vignette.hot{box-shadow:inset 0 0 200px 60px rgba(90,0,0,.55);}

  /* 开始 / 结束 */
  #start,#end{
    position:absolute;inset:0;z-index:30;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:0 10%;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #start h1{font-size:30px;letter-spacing:12px;margin-bottom:10px;
    font-weight:normal;color:#b5b5b5;}
  #start .sub{font-size:12px;color:#3a3a3a;letter-spacing:6px;margin-bottom:38px;}
  #start p{font-size:14px;line-height:2.2;color:#666;margin-bottom:6px;}
  #start .key{color:#8fb08f;}
  #start button,#end button{
    margin-top:34px;background:none;border:1px solid #3a1a1a;
    color:#8a5a5a;padding:12px 34px;font-family:inherit;
    font-size:15px;letter-spacing:6px;cursor:pointer;
    animation:pulse 2.6s infinite;
  }
  @keyframes pulse{0%,100%{border-color:#3a1a1a}50%{border-color:#7a2a2a}}
  #end{display:none;}
  #end.show{display:flex;}
  #end h1{font-size:26px;letter-spacing:8px;margin-bottom:22px;
    font-weight:normal;color:#c23a3a;}
  #end p{font-size:15px;line-height:2.2;color:#777;}
  #end .red{color:#a52a2a;}
  #end button{animation:none;border-color:#333;color:#777;}

  .fade{animation:fadeout 1s forwards;}
  @keyframes fadeout{to{opacity:0;visibility:hidden;}}

  #err{position:absolute;left:0;right:0;top:0;z-index:99;
    background:#300;color:#f88;font-size:12px;padding:6px 10px;
    display:none;white-space:pre-wrap;font-family:monospace;}

  /* 屏幕适配 */
  @media (max-width:520px){
    #text{font-size:16px;bottom:16%;}
    #start h1{font-size:24px;letter-spacing:8px;}
    #battery{width:80px;height:14px;}
  }
  @media (min-height:900px){
    #text{font-size:21px;}
  }
</style>
</head>
<body>
<div id="err"></div>
<div id="game">
  <div id="view">
    <div class="obj" id="ball" style="display:none">⚫</div>
    <div class="obj" id="girl" style="display:none">👧</div>
    <div id="glow"></div>
    <div id="dark" class="off"></div>
    <div id="vignette"></div>
    <div id="grain"></div>
    <div id="face"><img id="faceImg" src="face.jpg" alt=""></div>
    <div id="flash"></div>
  </div>

  <div id="battery"><i></i></div>
  <div id="text"></div>
  <div id="hint">点击 / 空格 · 切换手电</div>

  <div id="start">
    <h1>今夜别开灯</h1>
    <div class="sub">DON'T TURN ON THE LIGHT</div>
    <p>你患有严重夜盲症。</p>
    <p>手机闪光灯是你唯一的光源——</p>
    <p class="key">但光照到的东西，会朝你靠近。</p>
    <p style="margin-top:18px;color:#444">建议：关灯 · 戴耳机 · 一个人</p>
    <button id="btnStart" type="button">进 入</button>
  </div>

  <div id="end">
    <h1 id="endTitle"></h1>
    <p id="endText"></p>
    <button id="btnAgain" type="button">再 来 一 次</button>
  </div>
</div>

<script>
window.onerror = function(msg,src,line,col){
  var e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = 'ERROR: ' + msg + ' @' + line + ':' + col;
};

(function(){
'use strict';

var $ = function(s){ return document.querySelector(s); };
var gameEl = $('#game'), viewEl = $('#view');
var darkEl = $('#dark'), glowEl = $('#glow');
var textEl = $('#text'), hintEl = $('#hint');
var ballEl = $('#ball'), girlEl = $('#girl');
var faceEl = $('#face'), faceImg = $('#faceImg');
var flashEl = $('#flash'), batEl = $('#battery i');
var startEl = $('#start'), endEl = $('#end');
var vignetteEl = $('#vignette');

var G = {
  light:false, battery:100, scene:0,
  running:false, acted:false, ending:null, _action:null,
  t:0, tilt:{x:0,y:0,tx:0,ty:0}
};

/* =========================================================
   音效系统（WebAudio 实时合成，无外部素材）
   ========================================================= */
var AC = null, masterGain = null, droneNode = null;
function audio(){
  try{
    if(!AC){
      AC = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = AC.createGain();
      masterGain.gain.value = 0.9;
      masterGain.connect(AC.destination);
    }
    if(AC.state === 'suspended') AC.resume();
    return AC;
  }catch(e){ return null; }
}

// 通用发声
function tone(freq, dur, type, vol, pan){
  type = type || 'sine'; vol = vol || .15; pan = pan || 0;
  try{
    var a = audio(); if(!a) return;
    var o = a.createOscillator(), g = a.createGain();
    var p = a.createStereoPanner ? a.createStereoPanner() : null;
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g);
    if(p){ p.pan.value = Math.max(-1,Math.min(1,pan)); g.connect(p); p.connect(masterGain); }
    else g.connect(masterGain);
    o.start(); o.stop(a.currentTime + dur);
  }catch(e){}
}

// 噪声
function noise(dur, vol, pan){
  vol = vol || .2; pan = pan || 0;
  try{
    var a = audio(); if(!a) return;
    var n = Math.floor(a.sampleRate * dur);
    var buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for(var i=0;i<n;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/n, 1.6);
    var s = a.createBufferSource(), g = a.createGain();
    var p = a.createStereoPanner ? a.createStereoPanner() : null;
    s.buffer = buf; g.gain.value = vol;
    s.connect(g);
    if(p){ p.pan.value = pan; g.connect(p); p.connect(masterGain); }
    else g.connect(masterGain);
    s.start();
  }catch(e){}
}

// 心跳
function heartbeat(){
  tone(58,.16,'sine',.35,-.2);
  setTimeout(function(){ tone(48,.2,'sine',.28,.2); },180);
}

// 尖叫（突脸）
function scream(){
  try{
    var a = audio(); if(!a) return;
    var o = a.createOscillator(), g = a.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(900, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(85, a.currentTime + .55);
    g.gain.setValueAtTime(.32, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, a.currentTime + .65);
    o.connect(g); g.connect(masterGain);
    o.start(); o.stop(a.currentTime + .65);
  }catch(e){}
  noise(.45,.28,0);
}

// 环境低频嗡鸣
function startDrone(){
  try{
    var a = audio(); if(!a || droneNode) return;
    var o1 = a.createOscillator(), o2 = a.createOscillator();
    var g = a.createGain();
    o1.type = 'sine'; o1.frequency.value = 42;
    o2.type = 'sine'; o2.frequency.value = 42.6; // 拍频
    g.gain.value = .05;
    o1.connect(g); o2.connect(g); g.connect(masterGain);
    o1.start(); o2.start();
    droneNode = {o1:o1,o2:o2,g:g};
  }catch(e){}
}

// 弹珠滚动：随机音高
function ballRoll(){
  var t = 0;
  var iv = setInterval(function(){
    var f = 1600 - t*80 + Math.random()*200;
    tone(f, .03, 'square', .05, (Math.random()-.5)*1.2);
    if(++t > 16) clearInterval(iv);
  }, 130);
}

// 呼吸声
function breath(){
  try{
    var a = audio(); if(!a) return;
    var n = Math.floor(a.sampleRate * .8);
    var buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for(var i=0;i<n;i++){
      var env = Math.sin(Math.PI * i / n);
      d[i] = (Math.random()*2-1) * env * .5;
    }
    var s = a.createBufferSource(), g = a.createGain();
    var f = a.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 600; f.Q.value = 1.2;
    s.buffer = buf; g.gain.value = .18;
    s.connect(f); f.connect(g); g.connect(masterGain);
    s.start();
  }catch(e){}
}

// 脚步
function step(){
  noise(.12,.12,(Math.random()-.5)*.8);
  tone(90,.08,'sine',.1,0);
}

// 门/锁
function lockClick(){
  tone(280,.04,'square',.12);
  setTimeout(function(){ tone(180,.05,'square',.1); },50);
  setTimeout(function(){ tone(120,.06,'square',.08); },110);
}

// 电流故障
function electricity(){
  noise(.35,.18,0);
  tone(60,.35,'sawtooth',.08);
}

/* =========================================================
   突脸（真人照片）
   ========================================================= */
function showFace(mode){
  if(mode === 'blank') faceEl.classList.add('blank');
  else faceEl.classList.remove('blank');
  // 重新触发 zoom 动画
  faceImg.style.animation = 'none';
  void faceImg.offsetWidth;
  faceImg.style.animation = '';
  faceEl.classList.add('show');
  scream();
  shakeView(1);
}
function hideFace(){ faceEl.classList.remove('show'); }

/* =========================================================
   第一人称视角（呼吸 + 倾斜 + 震动）
   ========================================================= */
var viewLoop = null;
function startViewLoop(){
  var last = performance.now();
  viewLoop = function(now){
    if(!G.running){ requestAnimationFrame(viewLoop); return; }
    var dt = Math.min(40, now - last) / 1000; last = now;
    G.t += dt;

    // 呼吸：上下浮动
    var breathY = Math.sin(G.t * 1.4) * 4;
    var breathX = Math.sin(G.t * 0.9) * 2.5;

    // 平滑跟随目标倾斜
    G.tilt.x += (G.tilt.tx - G.tilt.x) * Math.min(1, dt*6);
    G.tilt.y += (G.tilt.ty - G.tilt.y) * Math.min(1, dt*6);

    // 恐惧加成：电量低时抖动更大
    var fear = G.battery < 25 ? 1.8 : 1;
    var jitterX = (Math.random()-.5) * fear * 1.2;
    var jitterY = (Math.random()-.5) * fear * 1.2;

    var tx = breathX + G.tilt.x + jitterX;
    var ty = breathY + G.tilt.y + jitterY;
    var rot = G.tilt.x * 0.06 + Math.sin(G.t*0.7)*0.4;

    viewEl.style.transform =
      'translate3d(' + tx.toFixed(2) + 'px,' + ty.toFixed(2) + 'px,0) rotate(' + rot.toFixed(3) + 'deg)';

    requestAnimationFrame(viewLoop);
  };
  requestAnimationFrame(viewLoop);
}

function shakeView(intensity){
  var dur = 380;
  var start = performance.now();
  var id = setInterval(function(){
    var p = (performance.now() - start) / dur;
    if(p >= 1){ clearInterval(id); G.tilt.x = G.tilt.y = 0; return; }
    var k = (1-p) * 22 * intensity;
    G.tilt.x = (Math.random()-.5) * k;
    G.tilt.y = (Math.random()-.5) * k;
  }, 30);
}

/* =========================================================
   打字机（支持嵌套标签）
   ========================================================= */
var typingTimer = null;
function say(html, speed, cb){
  speed = speed || 32;
  if(typingTimer){ clearInterval(typingTimer); typingTimer = null; }
  textEl.innerHTML = '';

  var tokens = [];
  var i = 0;
  while(i < html.length){
    if(html[i] === '<'){
      var end = html.indexOf('>', i);
      if(end === -1){ i++; continue; }
      var tag = html.substring(i, end+1);
      var cls = null, isDiv = false;
      if(tag.indexOf('class="sys"') !== -1) cls = 'sys';
      else if(tag.indexOf('class="warn"') !== -1) cls = 'warn';
      else if(tag.indexOf('class="msg"') !== -1){ cls = 'msg'; isDiv = true; }
      if(cls && tag[1] !== '/'){
        var closeTag = isDiv ? '</div>' : '</span>';
        var closeIdx = html.indexOf(closeTag, end);
        if(closeIdx === -1) closeIdx = html.length;
        var inner = html.substring(end+1, closeIdx);
        var j = 0;
        while(j < inner.length){
          if(inner[j] === '<'){
            var e2 = inner.indexOf('>', j);
            if(e2 === -1){ j++; continue; }
            j = e2 + 1; continue;
          }
          tokens.push({ch: inner[j], cls: cls, isDiv: isDiv});
          j++;
        }
        i = closeIdx + closeTag.length;
        continue;
      }
      i = end + 1;
      continue;
    }
    tokens.push({ch: html[i], cls: null, isDiv: false});
    i++;
  }

  var idx = 0;
  var container = document.createElement('div');
  textEl.appendChild(container);

  typingTimer = setInterval(function(){
    if(idx >= tokens.length){
      clearInterval(typingTimer); typingTimer = null;
      if(cb) cb();
      return;
    }
    var tk = tokens[idx];
    var target;
    if(tk.isDiv){
      target = container.querySelector('.msg');
      if(!target){ target = document.createElement('div'); target.className = 'msg'; container.appendChild(target); }
    } else if(tk.cls){
      target = container.querySelector('span.' + tk.cls);
      if(!target){ target = document.createElement('span'); target.className = tk.cls; container.appendChild(target); }
    } else {
      target = container.querySelector('span.plain');
      if(!target){ target = document.createElement('span'); target.className = 'plain'; container.appendChild(target); }
    }
    target.textContent += tk.ch;
    if(Math.random() < .2) tone(1150 + Math.random()*450, .012, 'square', .012,
      (Math.random()-.5)*.6);
    idx++;
  }, speed);
}

/* =========================================================
   界面控制
   ========================================================= */
function setLight(on){
  if(G.battery <= 0) on = false;
  G.light = on;
  if(on){ darkEl.classList.remove('off'); glowEl.classList.add('on'); }
  else { darkEl.classList.add('off'); glowEl.classList.remove('on'); }
  tone(on ? 950 : 320, .05, 'square', .05);
  hintEl.textContent = on ? '点击 / 空格 · 关闭手电' : '点击 / 空格 · 打开手电';
}
function setBattery(v){
  G.battery = Math.max(0, Math.min(100, v));
  batEl.style.width = G.battery + '%';
  batEl.style.background = G.battery>50 ? '#6a8f6a' : G.battery>20 ? '#8f8a5a' : '#8f3a3a';
  if(G.battery <= 0 && G.light) setLight(false);
}
function redFlash(){
  flashEl.classList.remove('on');
  void flashEl.offsetWidth;
  flashEl.classList.add('on');
}

/* =========================================================
   电量消耗（手电越暗，心跳越快）
   ========================================================= */
var lastBeat = 0;
setInterval(function(){
  if(!G.running) return;
  if(G.light){
    setBattery(G.battery - 0.35);
    if(Math.random() < .05) noise(.03,.02,0);
  } else {
    setBattery(G.battery - 0.02);
  }
  // 低电时心跳加速
  if(G.battery < 30){
    var now = performance.now();
    var interval = 400 + G.battery * 12;
    if(now - lastBeat > interval){ heartbeat(); lastBeat = now; }
  }
},100);

/* =========================================================
   剧情
   ========================================================= */
var scenes = {};

scenes[0] = function(){
  say('凌晨 1:47。电梯坏了。你住在 7 楼。', 40, function(){
    setTimeout(function(){
      ballEl.style.display = 'block';
      ballEl.classList.add('roll');
      ballRoll();
      say('楼上传来弹珠落地的声音……<br><span class="sys">哒……哒……哒……</span>', 45, function(){
        waitAction('照它', function(){
          redFlash();
          tone(1800,.1,'square',.15);
          setTimeout(function(){
            say('<span class="warn">弹珠上有一只眼睛。它眨了一下。</span>', 55, function(){

function go(n){
  G.scene = n; G.acted = false;
  scenes[n] && scenes[n]();
}

function waitAction(label, cb){
  G.acted = false;
  G._action = cb;
  hintEl.textContent = '点击 / 空格 · ' + label;
}

function end(type){
  G.running = false;
  G.ending = type;
  startDrone();
  var titles = { normal:'今 夜 别 开 灯', hidden:'前 置 摄 像 头' };
  var texts = {
    normal: '你被替换了。<br>从你关掉手电的那一刻起。<br><br><span class="red">这个"你"，只是它以为自己还是你。</span><br><br>请确认你身后没有人。<br>请确认你的脸还在。<br>请确认——<br>你还在。',
    hidden: '整个小区都是它们的养殖场。<br>每个住户家里都养着一只"空白脸"。<br><br>它们通过手机传播，通过闪光灯定位，<br>通过"看"来寄生。<br><br><span class="red">而你，早就被替换了。</span>'
  };
  $('#endTitle').textContent = titles[type] || titles.normal;
  $('#endText').innerHTML = texts[type] || texts.normal;
  endEl.classList.add('show');
  hintEl.style.display = 'none';
}

  if(!G.running) return;
  var now = performance.now();
  if(now - lastTap < 120) return; // 防抖
  lastTap = now;

  if(G._action && !G.acted){
    G.acted = true;
    var cb = G._action; G._action = null;
    cb();
    return;
